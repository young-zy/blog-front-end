<div class="flex flex-col justify-around items-stretch">
  <div class="w-full min-w-0 flex flex-row justify-around">
    <mat-card class="w-full sm:w-[95%] md:w-[85%] lg:w-[70%]"
              style="margin-top: 32px; margin-bottom: 32px; padding: 28px">
      <mat-progress-bar *ngIf="questionLoading" mode="indeterminate"
                        style="position: relative; left: -28px; top: -28px; width: calc(100% + 56px)"></mat-progress-bar>
      <mat-card-content>
        <div class="flex flex-row justify-around items-start">
          <div class="flex-none question-display" style="margin-right: 16px; margin-bottom: 0">Q:</div>
          <div class="w-full min-w-0">
            <div class="question-display" style="margin-bottom: 0; overflow-wrap: break-word;">
              {{ question?.questionContent }}
            </div>
            <div class="flex flex-row justify-start items-end" style="margin-top: 16px;">
              <span class="answer-status shrink-0" [class.solved]="question?.isAnswered">
                {{ question?.isAnswered ? '已回答' : '未回答' }}
              </span>
              <div [class.shrink-0]="question?.isAnswered" [class.flex-1]="!question?.isAnswered" style="opacity: 60%; margin-right: 16px;">
                提出于： {{ question?.createTime | date:'yyyy年M月d日 HH:mm:ss' }}</div>
              <div *ngIf="question?.isAnswered" class="flex-1 min-w-0" style="opacity: 60%">
                回答于： {{ question?.answerTime | date:'yyyy年M月d日 HH:mm:ss' }}</div>
            </div>
          </div>
        </div>
        <div style="margin-bottom: 32px; margin-top: 32px; height: 1px" *ngIf="question?.isAnswered || preview">
          <mat-divider></mat-divider>
        </div>
        <div *ngIf="question?.isAnswered || preview" class="flex flex-row justify-around items-start"
             style="margin-bottom: 32px;">
          <div class="flex-none question-display" style="margin-bottom: 16px; margin-right: 16px">A:</div>
          <div class="flex-auto min-w-0">
            <markdown [data]=" preview ? answerContentControl.value : question?.answerContent" emoji katex
                      ngPreserveWhitespaces></markdown>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
  <div class="w-full min-w-0 flex flex-row justify-around" *ngIf="!question?.isAnswered && (isLoggedIn | async)">
    <mat-card class="w-full sm:w-[95%] md:w-[85%] lg:w-[70%]" style="margin-top: 16px; padding: 32px;">
      <mat-card-title>回答</mat-card-title>
      <mat-card-content style="margin-top: 32px" class="flex flex-row justify-center">
        <mat-form-field class="w-[95%]" appearance="fill">
          <mat-label>回答内容</mat-label>
          <textarea matInput
                    cdkTextareaAutosize
                    cdkAutosizeMinRows="10"
                    [formControl]="answerContentControl"
                    required></textarea>
          <mat-error>回答不能为空</mat-error>
        </mat-form-field>
      </mat-card-content>
      <mat-card-actions dir="rtl">
        <button (click)="handleSubmit()" color="accent" mat-raised-button> 提交</button>
        <mat-checkbox style="margin-right: 16px;" (change)="handlePreviewChange($event)">预览</mat-checkbox>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
